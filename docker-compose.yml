services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    ports:
      - "5050:5000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/smart-leads
      JWT_SECRET: replace-with-a-long-random-secret
      JWT_EXPIRES_IN: 7d
      PORT: 5000
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5050/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
